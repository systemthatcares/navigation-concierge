<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation Concierge</title>
<style>
  :root {
    --ink: #17303b;
    --ink-soft: #4a626d;
    --teal: #0e6e56;
    --teal-dark: #085041;
    --teal-tint: #e3f2ec;
    --amber-tint: #faf0da;
    --amber-ink: #7a5208;
    --bg: #f4f6f5;
    --card: #ffffff;
    --line: #dde5e2;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  header {
    width: 100%; background: var(--card); border-bottom: 1px solid var(--line);
    padding: 18px 20px; text-align: center;
  }
  header h1 { font-size: 19px; font-weight: 650; color: var(--teal-dark); letter-spacing: 0.2px; }
  header p { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  #chat-wrap { width: 100%; max-width: 640px; flex: 1; display: flex; flex-direction: column; padding: 18px 14px 120px; }
  .msg { max-width: 86%; margin: 6px 0; padding: 11px 15px; border-radius: var(--radius); font-size: 15px; line-height: 1.55; animation: rise .25s ease; }
  .agent { background: var(--card); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  .user  { background: var(--teal); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .note  { background: var(--amber-tint); color: var(--amber-ink); border: 1px solid #efd9a5; align-self: flex-start; font-size: 13.5px; }
  .typing { display: inline-block; }
  .typing span { display:inline-block; width:6px; height:6px; margin:0 2px; background:var(--ink-soft); border-radius:50%; opacity:.4; animation: blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s } .typing span:nth-child(3){ animation-delay:.4s }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:.9} }
  @keyframes rise { from { transform: translateY(6px); opacity: 0 } to { transform: none; opacity: 1 } }
  #controls {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: center;
    background: linear-gradient(transparent, var(--bg) 30%); padding: 18px 14px 20px;
  }
  #controls-inner { width: 100%; max-width: 640px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  button.chip {
    border: 1.5px solid var(--teal); background: var(--card); color: var(--teal-dark);
    padding: 9px 16px; border-radius: 999px; font-size: 14.5px; font-weight: 550; cursor: pointer;
    transition: background .15s;
  }
  button.chip:hover { background: var(--teal-tint); }
  button.chip.primary { background: var(--teal); color: #fff; }
  input.free {
    flex: 1; min-width: 130px; border: 1.5px solid var(--line); border-radius: 999px;
    padding: 9px 16px; font-size: 15px; outline-color: var(--teal);
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 10px 0; align-self: stretch; max-width: 100%; animation: rise .3s ease; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); margin-bottom: 10px; }
  .card h3 { font-size: 17px; color: var(--teal-dark); margin-bottom: 6px; }
  .pill { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; margin: 2px 4px 2px 0; }
  .pill.open { background: var(--teal-tint); color: var(--teal-dark); }
  .pill.closed { background: #f6e7e7; color: #8c3030; text-decoration: line-through; }
  /* Unresolved reads as neither open nor ruled out: amber, no strikethrough. */
  .pill.unresolved { background: #fdf0d9; color: #8a5a12; }
  /* Household notes. Named hh- to avoid the .note chat-bubble class above. */
  .hh-notes { background: #fff; border: 1px solid var(--teal-dark); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .hh-notes h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px; color: var(--teal-dark); }
  .hh-note { font-size: 14px; line-height: 1.55; margin-bottom: 8px; }
  .hh-note:last-child { margin-bottom: 0; }
  .why { font-size: 13px; color: var(--ink-soft); margin: 2px 0 8px; }
  .rank-row { margin: 10px 0; }
  .rank-head { display: flex; justify-content: space-between; font-size: 14.5px; font-weight: 600; }
  .bar-track { background: #edf1ef; border-radius: 6px; height: 8px; margin-top: 5px; overflow: hidden; }
  .bar { height: 100%; border-radius: 6px; background: var(--teal); transition: width .6s ease; }
  .bar.neg { background: #c98181; }
  .reason { font-size: 13px; color: var(--ink-soft); margin-top: 4px; padding-left: 12px; }
  .verify { font-size: 13px; color: var(--amber-ink); margin-top: 4px; padding-left: 12px; }
  .rec { border: 2px solid var(--teal); background: var(--teal-tint); }
  .action { display: flex; gap: 10px; margin: 9px 0; font-size: 14.5px; line-height: 1.5; }
  .action .n { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--teal); color: #fff; font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  footer.disclaimer { font-size: 12px; color: var(--ink-soft); text-align: center; padding: 8px 20px 16px; max-width: 640px; }
</style>
</head>
<body>
<header>
  <h1>Navigation Concierge</h1>
  <p>Lost employer health coverage? Get an unbiased read on your options. No commissions, no sales.</p>
</header>
<div id="chat-wrap"></div>
<div id="controls"><div id="controls-inner"></div></div>
<!-- bump ?v= on every script change: python http.server sends no cache headers, so browsers heuristically cache -->
<script src="fpl.js?v=0.2.0"></script>
<script src="scoring.js?v=0.2.1"></script>
<script src="app.js?v=0.2.1"></script>
</body>
</html>
